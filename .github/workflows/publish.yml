name: Publish

# House scheme: the version in Cargo.toml is the release, published only when crates.io lacks it.
# Manual only; releases are normally published locally after the merge.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the registry token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is empty: gh secret set CARGO_REGISTRY_TOKEN --repo pathscale/ps-unwind"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - run: cargo build --release

      - name: Publish a missing version
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "ps-unwind") | .version')
          if cargo info --registry crates-io "ps-unwind@$version" > /dev/null 2>&1; then
            echo "ps-unwind $version is already on crates.io"
          else
            cargo publish --token "$CARGO_REGISTRY_TOKEN"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
