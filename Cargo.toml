[package]
name = "ps-unwind"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pathscale stack unwinder: a no_std _Unwind_* implementation in Rust"
publish = false

[lib]
name = "ps_unwind"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
libc = { version = "^0", default-features = false }
# no_std: 0.1.4 with default-features = false does not enable its own spin
# and libc dependencies, so they are named here (spin-garbage pulls spin).
ps-reclaim = { version = "^0.1", default-features = false, features = ["spin-garbage", "libc"] }

[features]
default = []
# Defines a #[panic_handler] that aborts. Required for the staticlib, built with
# tools/build.sh; leave it off when the rlib goes into a std program.
staticlib = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
