[package]
name = "ps-unwind"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pathscale stack unwinder: a no_std _Unwind_* implementation in Rust"
repository = "https://github.com/pathscale/ps-unwind"
readme = "README.md"
keywords = ["unwind", "no_std", "exceptions", "backtrace", "aarch64"]
categories = ["no-std", "development-tools::debugging"]
# Verification transcripts stay in the repository; the published crate carries the code,
# docs, fixtures and tools.
exclude = ["transcripts/"]

[lib]
name = "ps_unwind"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
libc = { version = "^0", default-features = false }
# no_std with default-features = false alone (0.1.5 and later). The image
# cache pins through ReaderSlot / Domain::pin_reader (0.1.5).
ps-reclaim = { version = "^0.1", default-features = false }

# tools/eko-dump.rs: dumps EKO tables through the reader for tools/eko2.ts.
[[example]]
name = "eko-dump"
path = "tools/eko-dump.rs"

[features]
default = []
# Defines a #[panic_handler] that aborts. Required for the staticlib, built with
# tools/build.sh; leave it off when the rlib goes into a std program.
staticlib = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
